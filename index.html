<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Workaround for environments where window.fetch is a getter-only property
      // and a library tries to polyfill/assign it (e.g., node-fetch/formdata-polyfill via Vite deps)
      try {
        var originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Ignored attempt to overwrite window.fetch'); },
            configurable: true
          });
        }
      } catch (e) {
        console.error('Failed to apply fetch polyfill workaround', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
